services:
  web:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8503}:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-/data/badminton.db}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - ./data:/data
      # 更新日志页运行时读取仓库根目录的 CHANGELOG.md
      - ../CHANGELOG.md:/app/CHANGELOG.md:ro
    restart: unless-stopped
